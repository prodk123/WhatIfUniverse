events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Basic Settings
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip Settings
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Limit Request Zone
    limit_req_zone $binary_remote_addr zone=mylimit:10m rate=10r/s;

    upstream nextjs {
        server web:3000;
    }

    server {
        listen 80;
        server_name whatifuniverse.com www.whatifuniverse.com;
        
        # Redirect all HTTP traffic to HTTPS (handled by Cloudflare in reality, but good to have)
        # return 301 https://$host$request_uri;

        # Mitigate CVE-2025-29927 (strip middleware subrequest header)
        # Note: Handled by Cloudflare proxy rules in production, but adding here as defense-in-depth
        proxy_set_header x-middleware-subrequest "";

        location / {
            limit_req zone=mylimit burst=20 nodelay;
            
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Cache static assets
        location /_next/static {
            proxy_pass http://nextjs;
            proxy_cache_valid 200 365d;
            expires 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Cache images
        location /_next/image {
            proxy_pass http://nextjs;
            proxy_cache_valid 200 30d;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
        }
    }
}
