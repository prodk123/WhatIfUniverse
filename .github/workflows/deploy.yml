name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t whatif-web:latest .

      - name: Save Docker Image
        run: docker save whatif-web:latest -o whatif-web.tar

      - name: Copy files to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "whatif-web.tar,docker-compose.yml,nginx/"
          target: "/opt/whatifuniverse"

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Clean up disk space before loading the new image
            docker system prune -a -f
            
            cd /opt/whatifuniverse
            # Ensure .env.local exists (docker-compose may reference it)
            touch .env.local
            # Load the new image and restart
            docker load -i whatif-web.tar
            docker compose down --remove-orphans
            docker compose up -d
            # Wait for container to stabilize
            sleep 5
            # Log container status for debugging
            echo "=== Container Status ==="
            docker compose ps
            echo "=== Web Container Logs (last 30 lines) ==="
            docker compose logs --tail=30 web
            # Cleanup
            rm whatif-web.tar
            docker image prune -f
